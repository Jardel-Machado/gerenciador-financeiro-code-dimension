<app-balance [transactions]="transactions()"></app-balance>

<div class="actions">
  <a matButton="filled" routerLink="create">Adicionar transação</a>
</div>

<div class="transactions">
  @for (transation of transactions(); track transation) {
    <app-transaction-item class="transaction" [transaction]="transation"></app-transaction-item>
  }@empty {
    <app-no-transactions/>
  }
</div>
