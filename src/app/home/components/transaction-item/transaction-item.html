<mat-card class="card">
  <div>
    <ng-template [isIncome]="transaction().type" [isIncomeElse]="elseTemplate">
      <mat-chip-set>
        <mat-chip>É ganho</mat-chip>
      </mat-chip-set>
    </ng-template>
    <ng-template #elseTemplate>
      <mat-chip-set>
        <mat-chip>É despesa</mat-chip>
      </mat-chip-set>
    </ng-template>
    <div class="card-title">
      {{ transaction().title }}
    </div>

    <div class="card-value">
      <app-transaction-value [transaction]="transaction()"/>
    </div>
  </div>
  <div class="card-actions">
    <button matButton="filled" matButtonColor="error" (click)="remove.emit(transaction())">Remover</button>
    <button matButton="filled" (click)="edit.emit(transaction())">Editar</button>
  </div>
</mat-card>
