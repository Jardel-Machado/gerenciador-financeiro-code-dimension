<h2 mat-dialog-title>{{ dialogData().title }}</h2>
<mat-dialog-content>
  {{ dialogData().message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">{{ dialogData().cancelText || 'Cancelar' }}</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>{{ dialogData().confirmText || 'Confirmar' }}</button>
</mat-dialog-actions>
